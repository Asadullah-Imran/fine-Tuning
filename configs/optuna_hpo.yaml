# Optuna Hyperparameter Optimization Search Space Configuration
study:
  name: "muse_gcn_tpe_optimization"
  direction: "maximize"
  metric_target: "silhouette"      # Use 'silhouette' for unsupervised or 'ari' for validation split
  sampler: "tpe"
  n_trials: 50
  epochs_per_trial: 150

search_space:
  lr:
    min: 0.0001
    max: 0.005
    log: true
  weight_decay:
    min: 1e-6
    max: 1e-3
    log: true
  dropout:
    min: 0.0
    max: 0.5
    step: 0.1
  beta:
    min: 5.0
    max: 100.0
    log: true
  gamma:
    min: 0.1
    max: 30.0
    log: true
  delta:
    min: 0.1
    max: 10.0
    log: true
  hidden_dim: [128, 256, 512]
  out_dim: [32, 64, 128]
  spatial_k: [4, 6, 8, 10, 12, 15, 20]
  fusion_type: ["concat", "weighted", "attention"]
  alpha:
    min: 0.1
    max: 0.9
    step: 0.1

